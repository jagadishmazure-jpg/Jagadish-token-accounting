[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "token-accounting"
version = "0.1.0"
description = "End-to-end token accounting with real tokenizers: from-scratch BPE, full request accounting, pre-flight gateway, local-model reconciliation, cost ledger and rule-of-thumb error"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = ["tiktoken==0.12.0"]

[project.optional-dependencies]
spm = ["sentencepiece==0.2.2"]
local = ["llama-cpp-python==0.3.36"]
charts = ["matplotlib==3.11.2"]
dev = ["pytest==9.1.1", "ruff==0.14.1", "sentencepiece==0.2.2"]

[project.scripts]
tokacct = "tokacct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
