# Offline CI: lint, tests, printed test count, demo, recomputed numbers, docs drift,
# brand check and a full-history secret scan. Actions are pinned to SHAs.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev,charts]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q -rs
      - name: Test count (printed, not swallowed)
        run: python scripts/count_tests.py
      - name: Demo
        run: tokacct demo
      - name: Recomputed numbers match results.json
        run: tokacct bench --check results.json
      - name: README and docs numbers match
        run: python scripts/render_docs.py --check
      - name: Brand check (hashed blocklist)
        run: python scripts/check_brands.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
